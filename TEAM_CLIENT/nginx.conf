# TaskFlow frontend + gateway
#   /            → React static build (SPA fallback)
#   /api/*       → Laravel      (laravel:8000)
#   /sanctum/*   → Laravel      (CSRF cookie for cookie auth)
#   /socket.io/* → Node.js      (node-service:3000, websocket)
#
# Upstreams are resolved at request time through Docker's DNS, so this
# container starts even if laravel / node-service are not up yet (502 until they are).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $laravel_upstream http://laravel:8000;
    set $socket_upstream  http://node-service:3000;

    client_max_body_size 10m;
    server_tokens off;

    # ---- security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- compression ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- health check (Docker HEALTHCHECK / compose) ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Laravel REST API + Sanctum CSRF cookie (/sanctum/csrf-cookie) ----
    location ~ ^/(api|sanctum)/ {
        proxy_pass $laravel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Node.js Socket.IO (websocket upgrade) ----
    location /socket.io/ {
        proxy_pass $socket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- hashed build assets: cache forever ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- SPA: unknown paths → index.html (never cached) ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
